# Scene with fullscreen video: LEDs set the mood, a looping video plays,
# then a second clip replaces it and everything winds down together.
# Video needs ffplay (`brew install ffmpeg`). Point `file` at your own clips.
name: Video Demo
end: 20 # hard stop after 20s (safety; remove to run until cues finish)

cues:
  # LED on pin 13 blinks as a "warming up" indicator.
  - { at: 0, action: blink, pin: 13, interval: 0.4 }

  # Looping video starts fullscreen; scene keeps running underneath.
  - { at: 2, action: video, file: intro.mp4, loop: true, volume: 0.8 }

  # Servo moves while the video plays.
  - { at: 4, action: servo, pin: 9, angle: 180, duration: 2 }

  # Swap to the main clip: `replace` closes the looping intro first.
  - { at: 8, action: video, file: main.mp4 }

  # Close the video but leave the LED blinking.
  - { at: 16, action: stop_video }

  # Everything stops: LEDs off, audio and video closed, behaviors cleared.
  - { at: 18, action: stop_all }
